name: Go client

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      XSTREAMING_REQUIRE_MEDIA_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio pulseaudio-utils xvfb xauth x11-utils libgtk-3-0t64
          command -v ffmpeg
          command -v ffplay
      - run: go test -race ./...
      - run: go vet ./...
      - name: Smoke test native Linux window
        run: |
          go build -o "$RUNNER_TEMP/xstreaming-smoke" ./cmd/xstreaming
          bash scripts/smoke-linux.sh "$RUNNER_TEMP/xstreaming-smoke"
      - name: Test virtual PulseAudio capture
        run: |
          pulse_dir="$RUNNER_TEMP/xstreaming-pulse"
          mkdir -p "$pulse_dir/runtime" "$pulse_dir/state"
          chmod 700 "$pulse_dir" "$pulse_dir/runtime" "$pulse_dir/state"
          cat > "$pulse_dir/server.pa" <<EOF
          load-module module-native-protocol-unix socket=$pulse_dir/runtime/native auth-anonymous=1
          load-module module-null-source source_name=virtual_mic
          set-default-source virtual_mic
          EOF
          PULSE_RUNTIME_PATH="$pulse_dir/runtime" PULSE_STATE_PATH="$pulse_dir/state" \
            pulseaudio --daemonize=no --exit-idle-time=-1 --use-pid-file=no --disable-shm=true \
            --log-target=stderr -n -F "$pulse_dir/server.pa" > "$pulse_dir/server.log" 2>&1 &
          pulse_pid=$!
          trap 'kill "$pulse_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if pactl -s "unix:$pulse_dir/runtime/native" info >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          if ! pactl -s "unix:$pulse_dir/runtime/native" info >/dev/null 2>&1; then
            cat "$pulse_dir/server.log"
            exit 1
          fi
          XSTREAMING_TEST_PULSE_SERVER="unix:$pulse_dir/runtime/native" go test -race ./media ./session -run '^(TestEncodeMicrophoneFromVirtualPulseAudio|TestPulseSourcesWithVirtualServer|TestSessionNegotiationAndCleanup)$' -count=1
  native-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run native tests
        run: go test ./...
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build preview binary
        run: |
          mkdir -p "$RUNNER_TEMP/go-client"
          if [ "$GOOS" = windows ]; then
            binary="xstreaming.exe"
            go build -ldflags=-H=windowsgui -o "$RUNNER_TEMP/go-client/$binary" ./cmd/xstreaming
          else
            binary="xstreaming"
            go build -o "$RUNNER_TEMP/go-client/$binary" ./cmd/xstreaming
          fi
          cp README.md README.zh_CN.md "$RUNNER_TEMP/go-client/"
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: xstreaming-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/go-client/
          if-no-files-found: error
          retention-days: 14
